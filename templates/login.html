<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso · Registro de Trabajos Externos</title>
<style>
:root{
  --navy:#0a2458;--navy2:#123a7a;--or:#ff6a13;
  --bg:#eef1f7;--tx:#14203a;--mut:#5c6b86;--bd:#d5dce8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#061a42 0%,#0a2458 45%,#123a7a 100%);
  font:14.5px/1.5 "Segoe UI",Calibri,system-ui,sans-serif;
  color:var(--tx);-webkit-font-smoothing:antialiased;
  padding:24px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 85% 10%,rgba(255,106,19,.2),transparent 55%),
    radial-gradient(ellipse 40% 40% at 10% 90%,rgba(26,74,148,.4),transparent 50%);
}
.card{
  position:relative;width:100%;max-width:400px;
  background:#fff;border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  overflow:hidden;
}
.top{
  background:linear-gradient(135deg,#0a2458,#123a7a);
  padding:28px 28px 22px;text-align:center;color:#fff;
  border-bottom:3px solid var(--or);
}
.top .brand{
  display:inline-block;background:#fff;border-radius:10px;
  padding:8px 14px;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
.top .brand img{height:52px;display:block}
.top h1{font-size:18px;font-weight:650;letter-spacing:-.2px;margin:0}
.top p{margin:6px 0 0;font-size:12.5px;color:#b8c8e8;opacity:.95}
.body{padding:28px 28px 24px}
label{
  display:block;font-size:11px;font-weight:700;color:var(--mut);
  text-transform:uppercase;letter-spacing:.65px;margin-bottom:7px;
}
input{
  width:100%;padding:12px 14px;border:1.5px solid #c8d0e0;
  border-radius:8px;font:inherit;color:var(--tx);background:#fff;
  transition:border-color .15s,box-shadow .15s;
}
input:focus{
  outline:0;border-color:var(--navy2);
  box-shadow:0 0 0 3.5px rgba(18,58,122,.13);
}
.field{margin-bottom:16px}
.err{
  background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;
  padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;
  margin-bottom:16px;
}
button{
  width:100%;padding:12px 18px;border:0;border-radius:8px;
  background:linear-gradient(180deg,#123a7a,#0a2458);color:#fff;
  font:inherit;font-weight:650;font-size:14.5px;cursor:pointer;
  box-shadow:0 2px 10px rgba(10,36,88,.3);transition:all .18s;
  letter-spacing:.2px;
}
button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(10,36,88,.35)}
button:active{transform:translateY(0)}
.foot{
  text-align:center;padding:0 28px 22px;
  font-size:11.5px;color:var(--mut);line-height:1.5;
}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="CESOP Hogar · Entel"
             onerror="this.style.display='none'">
      </div>
      <h1>Registro de Trabajos Externos</h1>
      <p>CESOP Hogar · Entel — Acceso seguro</p>
    </div>
    <form class="body" method="post" autocomplete="on">
      {% if error %}
      <div class="err">{{ error }}</div>
      {% endif %}
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" required autofocus
               placeholder="Tu usuario" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required
               placeholder="Tu contraseña" autocomplete="current-password">
      </div>
      <button type="submit">Ingresar</button>
    </form>
    <div class="foot">
      Acceso restringido · Solo personal autorizado<br>
      Diseñado y Publicado por Jonny Lazo (CESOP)
    </div>
  </div>
</body>
</html>
